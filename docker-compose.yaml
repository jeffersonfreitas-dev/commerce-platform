services:
  keycloak-db:
    image: postgres:17
    container_name: ecom-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - identity
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_DB_USERNAME} -d ${KEYCLOAK_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: commerce-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_IMPORT_STRATEGY: IGNORE_EXISTING
    ports:
      - "9000:8080"
    volumes:
      - ./infrastructure/keycloak/realm:/opt/keycloak/data/import:ro
      - ./infrastructure/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - identity
      - application
    mem_limit: 1g
    cpus: 1.0

  mailpit:
    image: axllent/mailpit:latest
    container_name: commerce-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - application

  customers-mariadb:
    image: mariadb:11.8
    container_name: customers-mariadb
    restart: unless-stopped
    env_file:
      - ./services/customer-service/.env
    volumes:
      - customers-mariadb-data:/var/lib/mysql
    networks:
      - customers-backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5

  customer-service:
    build:
      context: ./services/customer-service
      dockerfile: Dockerfile
    container_name: customer-service
    restart: unless-stopped
    env_file:
      - ./services/customer-service/.env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8081}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      customers-mariadb:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - customers-backend
      - application
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


volumes:
  keycloak-db-data:
  customers-mariadb-data:

networks:
  application:
    driver: bridge
  identity:
    internal: true
  customers-backend:
    internal: true
