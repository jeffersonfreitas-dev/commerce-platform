services:
  customer-mariadb:
    image: mariadb:11.8
    container_name: customer-mariadb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - customer-mariadb-data:/var/lib/mysql
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8081}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRETt}
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      customer-mariadb:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - backend
      - application
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  customer-mariadb-data:

networks:
  application:
    external: true
  backend:
    internal: true
