spring:
  port: ${SERVER_PORT:8082}
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:customersdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true