spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://order-db:5432/${ORDER_DB_NAME}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/commerce-platform
          jwk-set-uri: http://keycloak:8080/realms/commerce-platform/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: order-service
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/commerce-platform
            token-uri: http://keycloak:8080/realms/commerce-platform/protocol/openid-connect/token

